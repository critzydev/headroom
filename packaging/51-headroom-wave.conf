# Installed by Headroom. For the Elgato Wave family (USB vendor 0x0fd9): keeps the ones with a mono microphone and headphones
# in the profile that has both, keeps their microphones from going to sleep, and prefers them as the default.
# Delete this file (or run uninstall.sh) to go back to the stock behaviour.
#
# WirePlumber 0.5 syntax. Patterns starting with "~" are glob patterns (* and ?), not regex.
#
# In short:
#   * the profile pin below is one rule per product id, only for the cards that have the Wave:3's layout (one capture
#     channel, stereo headphones): Wave:1 006e, Wave:3 0070, Wave Neo 0098, Wave XLR 007d. The multichannel and stereo-mic
#     models (Wave XLR MK.2, XLR Dock MK.2, Wave XLR Pro, Wave:3 MK.2, XLR Dock) keep the profile WirePlumber chooses:
#     "mono-fallback" would be wrong for them. Headroom switches any Elgato Wave out of S/PDIF and Pro Audio at run time.
#   * the priority rules match by node name, which differs by generation ("Elgato_Systems_Elgato_Wave_3_..." for the older
#     ones, "Elgato_Elgato_Wave_XLR_MK.2_..." for the MK.2 family, "Elgato_Systems_Elgato_XLR_Dock_..."), so they match
#     "Wave" or "XLR" after "usb-Elgato_". Elgato capture cards and cameras have neither word and are left alone.

monitor.alsa.rules = [
  {
    matches = [
      # Elgato Wave:1
      { device.vendor.id = "0x0fd9", device.product.id = "0x006e" }
    ]
    actions = {
      update-props = {
        device.profile = "output:analog-stereo+input:mono-fallback"
      }
    }
  }
  {
    matches = [
      # Elgato Wave:3
      { device.vendor.id = "0x0fd9", device.product.id = "0x0070" }
    ]
    actions = {
      update-props = {
        device.profile = "output:analog-stereo+input:mono-fallback"
      }
    }
  }
  {
    matches = [
      # Elgato Wave Neo
      { device.vendor.id = "0x0fd9", device.product.id = "0x0098" }
    ]
    actions = {
      update-props = {
        device.profile = "output:analog-stereo+input:mono-fallback"
      }
    }
  }
  {
    matches = [
      # Elgato Wave XLR
      { device.vendor.id = "0x0fd9", device.product.id = "0x007d" }
    ]
    actions = {
      update-props = {
        device.profile = "output:analog-stereo+input:mono-fallback"
      }
    }
  }
  {
    matches = [
      { node.name = "~alsa_input.usb-Elgato_*Wave*" }
      { node.name = "~alsa_input.usb-Elgato_*XLR*" }
    ]
    actions = {
      update-props = {
        priority.session = 3000
        priority.driver = 3000
        node.pause-on-idle = false
      }
    }
  }
  {
    matches = [
      { node.name = "~alsa_output.usb-Elgato_*Wave*" }
      { node.name = "~alsa_output.usb-Elgato_*XLR*" }
    ]
    actions = {
      update-props = {
        priority.session = 1500
        priority.driver = 3000
        node.pause-on-idle = false
      }
    }
  }
]

# If a stored profile does not decide it, this one is preferred (WirePlumber 0.5.10 and newer). The card name that the Wave:3
# has always been matched by, and the same four products as the pin above by their USB ids.
device.profile.priority.rules = [
  {
    matches = [
      { device.name = "~alsa_card.usb-Elgato_Systems_Elgato_Wave_*" }
      { device.vendor.id = "0x0fd9", device.product.id = "0x006e" }
      { device.vendor.id = "0x0fd9", device.product.id = "0x0070" }
      { device.vendor.id = "0x0fd9", device.product.id = "0x0098" }
      { device.vendor.id = "0x0fd9", device.product.id = "0x007d" }
    ]
    actions = {
      update-props = {
        priorities = [ "output:analog-stereo+input:mono-fallback" ]
      }
    }
  }
]
